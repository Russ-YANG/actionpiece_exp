# Config for sentence embedding model
sent_emb_backend: sentence_transformers # sentence_transformers / qwen_api / qwen_local
sent_emb_model: sentence-transformers/sentence-t5-base
sent_emb_batch_size: 512
sent_emb_dim: 768
sent_emb_pca: -1 # -1 means no PCA, otherwise PCA dimension

# Qwen API text encoder (E1), used with metadata=qwen_text
qwen_api_env_file: .env.local
qwen_api_endpoint: ~ # Use the DashScope default unless overridden
qwen_api_batch_size: 20
qwen_api_timeout: 120
qwen_api_max_retries: 5
qwen_api_instruction: >-
  Represent this e-commerce product for semantic similarity and sequential
  recommendation. Capture its category, function, attributes, style, and likely
  user intent.

# Local Qwen3-VL encoder. Keep the canonical model ID separate from the local
# path so cache names remain portable across machines.
qwen_local_model_path: /root/autodl-tmp/models/Qwen3-VL-Embedding-8B
qwen_local_model_revision: 2c4565515e0f265c6511776e7193b22c0968ddc7
qwen_local_repo_path: /root/autodl-tmp/qwen3-vl-embedding
qwen_local_code_revision: 393e2978d27852b0d0230d6994f37f9c15bed73c
qwen_local_batch_size: 8
qwen_local_max_length: 2048
qwen_local_torch_dtype: bfloat16
qwen_local_attn_implementation: sdpa
qwen_local_require_cuda: true

# Config for image embedding model, used when metadata=sentence_image or
# metadata=sentence_image_fused
image_emb_model: openai/clip-vit-base-patch32
image_emb_batch_size: 64
image_emb_dim: 512
image_download_timeout: 10
fused_image_weight: 1.0

# Config for features
n_threads: 32
pq_n_codebooks: 4
pq_codebook_size: 256
image_pq_n_codebooks: 4
image_pq_codebook_size: 256
n_hash_buckets: 128

# Config for the action tokenizer
actionpiece_vocab_size: 40000
actionpiece_merge_log: True
actionpiece_merge_log_interval: 1
actionpiece_merge_log_path: ~

# Config for the model
num_beams: 50 # Number of beams for beam search
n_inference_ensemble: 5 # Number of inference ensemble
train_shuffle: feature # none / feature / token

# Config for the task
max_item_seq_len: 20

# Config for T5
num_layers: 4
num_decoder_layers: 4
d_model: 128
d_ff: 1024
num_heads: 6
d_kv: 64
dropout_rate: 0.1
activation_function: "relu"
feed_forward_proj: "relu"
