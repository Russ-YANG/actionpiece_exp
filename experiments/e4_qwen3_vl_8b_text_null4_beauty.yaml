# E4-Zero tokenizer control: retain the original E4 raw nine-slot structure,
# but replace the four learned image OPQ codes with four fixed NULL codes.
# NULL=256 is outside the learned image-code range [0, 255].
category: Beauty
metadata: qwen_separate
sent_emb_backend: qwen_local
sent_emb_model: Qwen/Qwen3-VL-Embedding-8B
sent_emb_dim: 768
sent_emb_pca: -1
qwen_api_instruction: >-
  Represent this e-commerce product for semantic similarity and sequential
  recommendation. Capture its category, function, attributes, style, and likely
  user intent.
qwen_local_model_path: /root/autodl-tmp/models/Qwen3-VL-Embedding-8B
qwen_local_model_revision: 2c4565515e0f265c6511776e7193b22c0968ddc7
qwen_local_repo_path: /root/autodl-tmp/qwen3-vl-embedding
qwen_local_code_revision: 393e2978d27852b0d0230d6994f37f9c15bed73c
qwen_local_batch_size: 8
qwen_local_max_length: 2048
qwen_local_torch_dtype: bfloat16
qwen_local_attn_implementation: sdpa
qwen_local_require_cuda: true
image_emb_dim: 768
# Used only to locate the exact original E4 item-feature artifact. E4-Zero does
# not read the images, image embeddings, or image semantic IDs.
qwen_local_image_manifest_sha256: 2f0852d8f8d95fc84e623ae0841eaa7ff5cb902a9b427dded45559162b7009b1
pq_n_codebooks: 4
pq_codebook_size: 256
image_pq_n_codebooks: 4
image_pq_codebook_size: 256
separate_image_semantic_ids: fixed_null
n_threads: 8
actionpiece_merge_log: true
actionpiece_merge_log_interval: 1
tokenizer_only: true
run_id: beauty_e4_zero_qwen3_vl_8b_text_opq4_null4
