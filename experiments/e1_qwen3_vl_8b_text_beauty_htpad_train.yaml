# E1 post-tokenization history+target mean-length control. The frozen Beauty
# tokenizers average 2.194943 tokens/item for E1 and 4.877448 for E4, so the
# fixed integer control uses round(4.877448 - 2.194943) = 3 tokens.
category: Beauty
metadata: qwen_text
sent_emb_backend: qwen_api
sent_emb_model: qwen3-vl-embedding
sent_emb_dim: 768
sent_emb_pca: -1
qwen_api_instruction: >-
  Represent this e-commerce product for semantic similarity and sequential
  recommendation. Capture its category, function, attributes, style, and likely
  user intent.
pq_n_codebooks: 4
pq_codebook_size: 256
n_threads: 8
length_control_history_tokens_per_item: 3
length_control_target_tokens: 3
tokenizer_only: false
train_batch_size: 128
eval_batch_size: 64
epochs: 200
run_id: e1_beauty_htpad_h3_t3_bs128
